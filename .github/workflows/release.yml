# Release build: DEB + RPM + AppImage (Linux), signed Windows installer + portable zip, optional macOS .dmg, then a DRAFT GitHub Release.
#
#   git tag v2.1.0 && git push origin v2.1.0        (or: Actions > Release > Run workflow, with the tag name)
#
# When you press "Publish release" on the draft, .github/workflows/publish-repos.yml publishes the apt/dnf
# repositories and the signed update manifest.
#
# Secrets (all optional, but without them the output is unsigned):
#   WINDOWS_CERT_PFX_BASE64 / WINDOWS_CERT_PASSWORD   Authenticode certificate for the installer and iuk-browser.exe
#   GPG_PRIVATE_KEY (base64 of the armored key) / GPG_PASSPHRASE   sign the RPM package
#   APPLE_CERT_P12_BASE64 / APPLE_CERT_PASSWORD / APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD   macOS signing + notarization (experimental)
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v2.1.0). The tag must already exist."
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.m.outputs.version }}
      tag: ${{ steps.m.outputs.tag }}
      prerelease: ${{ steps.m.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - id: m
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PY="$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          INIT="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/iuk_browser/__init__.py)"
          [ "$PY" = "$VERSION" ] || { echo "::error::pyproject.toml version $PY does not match tag $TAG"; exit 1; }
          [ "$INIT" = "$VERSION" ] || { echo "::error::__init__.py version $INIT does not match tag $TAG"; exit 1; }
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
          awk -v v="$VERSION" '/^## \[/{p=(index($0,"["v"]")>0); next} p' CHANGELOG.md > release-notes.md
          PRE=false; case "$VERSION" in *-*) PRE=true;; esac
          { echo "version=$VERSION"; echo "tag=$TAG"; echo "prerelease=$PRE"; } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: release-notes, path: release-notes.md, retention-days: 30 }

  test:
    needs: meta
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu --disable-dev-shm-usage
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.meta.outputs.tag }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libnss3 libnspr4 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64 libxcb-cursor0 libxkbfile1 libfontconfig1 libpulse0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  linux:
    # Built on Ubuntu 22.04 so the bundle runs on distributions with glibc 2.35 or newer.
    needs: [meta, test]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.meta.outputs.tag }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -e ".[dev]"
      - name: Install nfpm
        run: |
          curl -fsSL -o nfpm.tgz https://github.com/goreleaser/nfpm/releases/download/v2.41.0/nfpm_2.41.0_Linux_x86_64.tar.gz
          sudo tar -xzf nfpm.tgz -C /usr/local/bin nfpm
      - name: Prepare RPM signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | base64 -d > "$RUNNER_TEMP/rpm-signing.asc"
            echo "NFPM_SIGNING_KEY_FILE=$RUNNER_TEMP/rpm-signing.asc" >> "$GITHUB_ENV"
            echo "NFPM_PASSPHRASE=${{ secrets.GPG_PASSPHRASE }}" >> "$GITHUB_ENV"
          else
            echo "::warning::GPG_PRIVATE_KEY is not set: the RPM will be unsigned"
          fi
      - name: Build DEB and RPM
        env:
          QT_QPA_PLATFORM: offscreen
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: packaging/build-linux.sh "${{ needs.meta.outputs.version }}"
      - name: Build the AppImage
        run: packaging/build-appimage.sh "${{ needs.meta.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/pkg/*.deb
            dist/pkg/*.rpm
            dist/*.AppImage
          retention-days: 30

  windows:
    needs: [meta, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.meta.outputs.tag }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Build, sign and package
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: powershell -File packaging\build-windows.ps1 -Version "${{ needs.meta.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/iuk-browser-*-setup.exe
            dist/iuk-browser-*-win64-portable.zip
          retention-days: 30

  macos:
    # EXPERIMENTAL and allowed to fail: it never blocks the release. Needs APPLE_* secrets for a signed, notarized .dmg.
    needs: [meta, test]
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.meta.outputs.tag }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -e ".[dev]"
      - name: Build, sign and notarize
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          QT_QPA_PLATFORM: offscreen
        run: packaging/macos/build-macos.sh "${{ needs.meta.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: dist/*.dmg
          retention-days: 30

  release:
    needs: [meta, linux, windows, macos]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Draft the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          cd artifacts
          shopt -s nullglob
          FILES=(iuk-browser_*_amd64.deb iuk-browser-*.x86_64.rpm iuk-browser-*-x86_64.AppImage "iuk-browser-${VERSION}-setup.exe" "iuk-browser-${VERSION}-win64-portable.zip" iuk-browser-*-macos-*.dmg)
          sha256sum "${FILES[@]}" > SHA256SUMS
          FILES+=(SHA256SUMS)
          FLAGS=(--draft --title "IUK Browser ${VERSION}" --notes-file release-notes.md --verify-tag)
          [ "$PRERELEASE" = true ] && FLAGS+=(--prerelease)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${FILES[@]}" "${FLAGS[@]}" --repo "$GITHUB_REPOSITORY"
          fi
          echo "Draft release created. Review it, then press Publish: that publishes the apt/dnf repositories and the update channel." >> "$GITHUB_STEP_SUMMARY"
