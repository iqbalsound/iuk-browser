# Phase 2: full Gecko build with IUK Browser branding (Linux x86_64 -> DEB + RPM).
# GitHub-hosted runners are small: this can exceed the 6 h job limit or run out of disk. If it does, build
# locally with build/build-source.sh, or point `runs-on` at a larger / self-hosted runner.
name: Source build (Linux)
on:
  workflow_dispatch:
    inputs:
      firefox_ref: { description: "Firefox tag (blank = latest ESR)", required: false, default: "" }
      runner: { description: "runs-on label", required: false, default: "ubuntu-latest" }
jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: Install nfpm
        run: |
          curl -fsSL -o nfpm.tgz https://github.com/goreleaser/nfpm/releases/download/v2.41.0/nfpm_2.41.0_Linux_x86_64.tar.gz
          sudo tar -xzf nfpm.tgz -C /usr/local/bin nfpm
      - name: Build
        run: build/build-source.sh
        env:
          FIREFOX_REF: ${{ inputs.firefox_ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - uses: actions/upload-artifact@v4
        with: { name: iuk-browser-linux, path: "dist/*.deb\ndist/*.rpm" }
