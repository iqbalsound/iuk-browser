name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu --disable-dev-shm-usage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: System libraries for Qt WebEngine (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libnss3 libnspr4 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64 libxcb-cursor0 libxkbfile1 libfontconfig1 libpulse0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1
      - run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Translations are complete and up to date
        if: runner.os == 'Linux'
        run: |
          python tools/make_catalogs.py
          git diff --exit-code -- src/iuk_browser/i18n

  packaging-smoke:
    # Proves the PyInstaller bundle starts, loads a page and exits cleanly (Linux).
    runs-on: ubuntu-22.04
    needs: test
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu --disable-dev-shm-usage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libnss3 libnspr4 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2 libxcb-cursor0 libxkbfile1 libfontconfig1 libpulse0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1
      - run: python -m pip install -e ".[dev]"
      - run: python -m PyInstaller packaging/iuk-browser.spec --noconfirm
      - run: dist/iuk-browser/iuk-browser --version
